<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#09060f"
>

<title>E-Portfolio</title>


<!-- OPTIONAL FONT
     If Google Fonts fails, the website still works normally.
-->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>


<style>
/* BSIT VIOLET THEME — edit these values to adjust the palette. */
:root {
    color-scheme: dark;
    --bg: #09060f;
    --bg-deep: #06040b;
    --violet: #b88aff;
    --violet-bright: #9a5bff;
    --violet-rgb: 184, 138, 255;
    --white: #f7f4fc;
    --muted: #aaa3b8;
    --line: rgba(var(--violet-rgb), .19);
    --line-soft: rgba(255, 255, 255, .08);
    --contour-opacity: .075;
    --contour-speed: 52s;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); scroll-behavior: smooth; scrollbar-width: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
body {
    min-width: 280px;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
    background: var(--bg);
    color: var(--white);
    font-family: "Inter", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}
::selection { background: rgba(154, 91, 255, .35); color: #fff; }
button, a { -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; }

/* Fixed, decorative background. White contours stay behind all content. */
.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    background:
        radial-gradient(ellipse at 14% 12%, rgba(113, 57, 190, .13), transparent 48%),
        radial-gradient(ellipse at 90% 72%, rgba(125, 66, 203, .09), transparent 48%),
        linear-gradient(160deg, var(--bg), var(--bg-deep));
}
.contour-layer {
    position: absolute;
    inset: -12%;
    opacity: var(--contour-opacity);
    transform-origin: 50% 50%;
    will-change: transform;
    animation: contourDrift var(--contour-speed) ease-in-out infinite alternate;
}
.contour-art { display: block; width: 100%; height: 100%; }
.background::after {
    content: "";
    position: absolute;
    inset: 0;
    /* A gentle veil keeps the white linework quiet behind the introduction. */
    background: radial-gradient(ellipse at 35% 35%, rgba(9, 6, 15, .28), transparent 70%);
}
@keyframes contourDrift {
    0% { transform: translate3d(-1.5%, -.8%, 0) scale(1.02) rotate(-.7deg); }
    50% { transform: translate3d(.5%, 1.1%, 0) scale(1.045) rotate(.2deg); }
    100% { transform: translate3d(1.5%, -.4%, 0) scale(1.025) rotate(.7deg); }
}

/* Navigation */
.navbar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 1000;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 max(24px, 7vw);
    background: rgba(9, 6, 15, .94);
    border-bottom: 1px solid var(--line-soft);
    box-shadow: 0 14px 45px rgba(0, 0, 0, .22);
}
@supports ((backdrop-filter: blur(14px)) or (-webkit-backdrop-filter: blur(14px))) {
    .navbar {
        background: rgba(9, 6, 15, .78);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }
}
.brand { font-size: 18px; font-weight: 900; letter-spacing: 1.4px; white-space: nowrap; }
.brand span, .intro-title span, .footer strong { color: var(--violet); }
.status {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}
.status-dot {
    flex: 0 0 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--violet);
    box-shadow: 0 0 14px rgba(var(--violet-rgb), .45);
    animation: dotPulse 3.5s ease-in-out infinite;
}
@keyframes dotPulse { 50% { opacity: .55; transform: scale(.85); } }

/* Existing introduction, activities, and footer */
main, .footer { position: relative; z-index: 1; }
.container { width: min(1180px, 86%); margin-inline: auto; }
.introduction {
    min-height: 100vh;
    min-height: 100svh;
    padding-top: 146px;
    padding-bottom: 110px;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
    gap: 72px;
    align-items: center;
}
.intro-content, .activity-content { min-width: 0; }
.eyebrow, .activities-label {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--violet);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
}
.eyebrow::before, .activities-label::before {
    content: "";
    flex: 0 0 32px;
    height: 2px;
    background: var(--violet);
    box-shadow: 0 0 12px rgba(var(--violet-rgb), .22);
}
.intro-title, .activities-title, .activity-title {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    overflow-wrap: break-word;
}
.intro-title {
    margin-top: 25px;
    font-size: clamp(68px, 8.3vw, 118px);
    line-height: .9;
    letter-spacing: -.055em;
}
.intro-title span { text-shadow: 0 0 34px rgba(var(--violet-rgb), .12); }
.intro-description, .activities-description, .activity-text {
    max-width: 640px;
    margin-top: 26px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.85;
    overflow-wrap: break-word;
}
.intro-image-area {
    min-width: 0;
    min-height: 520px;
    position: relative;
    display: grid;
    place-items: center;
    isolation: isolate;
}
.intro-glow {
    position: absolute;
    z-index: -2;
    width: 310px;
    max-width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(154, 91, 255, .15);
    filter: blur(68px);
}
.intro-ring {
    position: absolute;
    z-index: -1;
    width: min(420px, 100%);
    aspect-ratio: 1;
    border: 1px solid rgba(var(--violet-rgb), .17);
    border-radius: 50%;
    animation: ringRotate 32s linear infinite;
}
.intro-ring::before {
    content: "";
    position: absolute;
    top: -4px;
    left: calc(50% - 4px);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--violet);
    box-shadow: 0 0 18px rgba(var(--violet-rgb), .5);
}
@keyframes ringRotate { to { transform: rotate(360deg); } }
.floating-image {
    position: relative;
    width: min(350px, 90%);
    aspect-ratio: .78;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 34px;
    border: 1px solid rgba(var(--violet-rgb), .26);
    background:
        radial-gradient(circle at 76% 12%, rgba(154, 91, 255, .16), transparent 45%),
        linear-gradient(145deg, #1c122b, #0d0915);
    box-shadow: 0 36px 90px rgba(0, 0, 0, .48), 0 0 62px rgba(154, 91, 255, .06);
    animation: floatingMain 6s ease-in-out infinite;
}
.floating-image::after {
    content: "";
    position: absolute;
    inset: 11px;
    border: 1px solid rgba(255, 255, 255, .055);
    border-radius: 25px;
    pointer-events: none;
}
.floating-image img, .activity-image img { width: 100%; height: 100%; object-fit: cover; }
.image-placeholder, .activity-image-placeholder {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: clamp(38px, 5vw, 60px);
    color: var(--violet);
    letter-spacing: -.04em;
    text-align: center;
}
@keyframes floatingMain { 50% { transform: translateY(-13px) rotate(.6deg); } }

.activities-section { padding-top: 70px; padding-bottom: 100px; }
.activities-heading { margin-bottom: 52px; }
.activities-title {
    margin-top: 20px;
    font-size: clamp(58px, 8vw, 104px);
    line-height: .95;
    letter-spacing: -.055em;
}
.activities-description { margin-top: 23px; font-size: 16px; }
.activity-card {
    --tilt-x: 0deg;
    --tilt-y: 0deg;
    --lift: 0px;
    position: relative;
    min-height: 500px;
    margin-bottom: 30px;
    padding: 46px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 390px);
    gap: 58px;
    align-items: center;
    overflow: hidden;
    border-radius: 32px;
    border: 1px solid var(--line);
    background:
        radial-gradient(circle at 92% 12%, rgba(154, 91, 255, .08), transparent 40%),
        linear-gradient(145deg, rgba(25, 16, 38, .97), rgba(12, 8, 20, .98));
    box-shadow: 0 24px 76px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .025);
    transform: perspective(1000px) translateY(var(--lift)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
    transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease, opacity .85s ease;
}
.activity-card::before {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    top: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--violet-rgb), .45), transparent);
}
.activity-card::after {
    content: attr(data-number);
    position: absolute;
    right: 22px;
    bottom: -32px;
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: 190px;
    line-height: 1;
    color: rgba(var(--violet-rgb), .035);
    pointer-events: none;
    user-select: none;
}
@media (hover: hover) and (pointer: fine) {
    .activity-card:hover {
        --lift: -5px;
        border-color: rgba(var(--violet-rgb), .36);
        box-shadow: 0 32px 90px rgba(0, 0, 0, .34), 0 0 45px rgba(154, 91, 255, .045);
    }
}
/* Preserve the original alternating image/text arrangement. */
.activity-card:nth-child(even) { grid-template-columns: minmax(0, 390px) minmax(0, 1fr); }
.activity-card:nth-child(even) .activity-content { order: 2; }
.activity-card:nth-child(even) .activity-image { order: 1; }
.activity-content { position: relative; z-index: 2; }
.activity-number {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 42px;
    color: var(--violet);
    font-size: 16px;
    font-weight: 900;
}
.activity-number::after { content: ""; width: 58px; height: 1px; background: rgba(var(--violet-rgb), .35); }
.activity-title { font-size: clamp(44px, 5.4vw, 72px); line-height: .98; letter-spacing: -.045em; }
.activity-text { margin-top: 22px; font-size: 16px; line-height: 1.82; }
.activity-image {
    position: relative;
    z-index: 2;
    min-width: 0;
    width: 100%;
    height: 360px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 25px;
    border: 1px solid rgba(var(--violet-rgb), .18);
    background:
        radial-gradient(circle at 50% 34%, rgba(154, 91, 255, .13), transparent 55%),
        linear-gradient(145deg, #160f21, #0c0813);
    box-shadow: 0 24px 58px rgba(0, 0, 0, .28);
    animation: floatingSmall 6.5s ease-in-out infinite;
}
.activity-image-placeholder { font-size: 46px; }
@keyframes floatingSmall { 50% { transform: translateY(-8px); } }
.footer {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-top: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
}

/* Content is visible by default, including when JavaScript is unavailable. */
.reveal { opacity: 1; transition: opacity .85s ease, transform .85s ease; }
.reveal.is-pending { opacity: 0; transform: translateY(28px); }
.page-paused *, .page-paused *::before, .page-paused *::after { animation-play-state: paused !important; }

@media (max-width: 1000px) {
    .introduction { grid-template-columns: 1fr; gap: 30px; padding-top: 135px; padding-bottom: 80px; }
    .intro-image-area { min-height: 500px; }
    .activity-card, .activity-card:nth-child(even) { grid-template-columns: 1fr; gap: 40px; padding: 40px; }
    .activity-card:nth-child(even) .activity-content, .activity-card:nth-child(even) .activity-image { order: initial; }
}
@media (max-width: 650px) {
    :root { --contour-opacity: .065; --contour-speed: 60s; }
    .navbar { height: 70px; padding-inline: 22px; }
    .brand { font-size: 15px; }
    .status { font-size: 9px; letter-spacing: 1px; gap: 8px; }
    .container { width: calc(100% - 40px); }
    .introduction { min-height: auto; padding-top: 122px; padding-bottom: 70px; gap: 26px; }
    .eyebrow, .activities-label { font-size: 10px; letter-spacing: 3px; }
    .intro-title { font-size: clamp(54px, 15vw, 82px); }
    .intro-description { font-size: 15px; margin-top: 24px; line-height: 1.8; }
    .intro-image-area { min-height: 420px; }
    .intro-ring { width: min(310px, 100%); }
    .intro-glow { width: 230px; }
    .floating-image { width: min(255px, 90%); border-radius: 28px; }
    .floating-image::after { border-radius: 20px; }
    .image-placeholder { font-size: 44px; }
    .activities-section { padding-top: 50px; padding-bottom: 80px; }
    .activities-heading { margin-bottom: 40px; }
    .activities-title { font-size: clamp(40px, 11.4vw, 70px); letter-spacing: -.055em; }
    .activities-description { font-size: 14px; }
    .activity-card, .activity-card:nth-child(even) {
        min-height: auto;
        padding: 28px 22px;
        gap: 34px;
        border-radius: 26px;
        margin-bottom: 26px;
    }
    .activity-number { font-size: 14px; margin-bottom: 32px; }
    .activity-title { font-size: clamp(38px, 11vw, 52px); }
    .activity-text { font-size: 14px; }
    .activity-image { height: 285px; border-radius: 20px; }
    .activity-image-placeholder { font-size: 38px; }
    .activity-card::after { font-size: 130px; bottom: -24px; }
    .footer { min-height: 135px; flex-direction: column; justify-content: center; text-align: center; gap: 12px; }
}
@media (max-width: 350px) {
    .navbar { padding-inline: 16px; }
    .brand { font-size: 13px; }
    .status { font-size: 8px; letter-spacing: .5px; }
    .container { width: calc(100% - 32px); }
}
/* Respect the visitor's motion preference; the contour artwork stays visible. */
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .contour-layer { transform: none; will-change: auto; }
    .reveal.is-pending { opacity: 1; transform: none; }
    .activity-card, .activity-card:hover { transform: none; }
}

</style>
</head>
